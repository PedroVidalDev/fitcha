name: fitcha-admin

services:
  admin:
    image: ${ADMIN_IMAGE:-fitcha-admin:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${SERVER_PORT:-8081}/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
