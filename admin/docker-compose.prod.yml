name: fitcha-admin

services:
  admin:
    image: ${ADMIN_IMAGE:-fitcha-admin:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_DB_URL: ${ADMIN_DB_URL:?Set ADMIN_DB_URL in Dockhand stack variables}
      ADMIN_DB_USER: ${ADMIN_DB_USER:?Set ADMIN_DB_USER in Dockhand stack variables}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in Dockhand stack variables}
      SERVER_PORT: ${SERVER_PORT:-8081}
    ports:
      - "${ADMIN_HOST_PORT:-8081}:${SERVER_PORT:-8081}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${SERVER_PORT:-8081}/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
