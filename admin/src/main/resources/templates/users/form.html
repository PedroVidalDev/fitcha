<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${editing ? 'Editar usuário' : 'Novo usuário'}, 'users', ~{::section})}">
<section class="page-stack">
    <div class="page-heading compact-heading">
        <div>
            <a class="back-link" th:href="@{/users}">← Voltar para usuários</a>
            <span class="eyebrow">Acesso administrativo</span>
            <h2 th:text="${editing ? 'Editar usuário' : 'Novo usuário'}">Novo usuário</h2>
            <p th:text="${editing ? 'Atualize os dados e as permissões desta conta.' : 'Crie uma conta para acesso ao painel administrativo.'}">
                Crie uma conta para acesso ao painel administrativo.
            </p>
        </div>
    </div>

    <article class="panel form-panel">
        <form class="entity-form"
              th:action="${editing} ? @{/users/{id}(id=${user.id})} : @{/users}"
              method="post">
            <div class="form-grid">
                <label class="field field-full">
                    <span>Nome completo</span>
                    <input type="text" name="name" th:value="${user.name}" placeholder="Nome do usuário" required>
                </label>

                <label class="field">
                    <span>E-mail</span>
                    <input type="email" name="email" th:value="${user.email}" placeholder="usuario@fitcha.com" required>
                </label>

                <label class="field">
                    <span>Perfil de acesso</span>
                    <select name="role" required>
                        <option th:each="role : ${roles}"
                                th:value="${role}"
                                th:text="${role}"
                                th:selected="${role == user.role}">
                            ADMIN
                        </option>
                    </select>
                </label>

                <label class="field field-full">
                    <span th:text="${editing ? 'Nova senha' : 'Senha'}">Senha</span>
                    <input
                        type="password"
                        name="password"
                        placeholder="Mínimo recomendado: 12 caracteres"
                        autocomplete="new-password"
                        th:required="${!editing}">
                    <small th:if="${editing}">Deixe em branco para manter a senha atual.</small>
                </label>
            </div>

            <div class="form-note">
                <span aria-hidden="true">i</span>
                <p>Usuários com perfil <strong>ADMIN</strong> podem acessar todas as áreas deste painel.</p>
            </div>

            <div class="form-actions">
                <a class="button button-ghost" th:href="@{/users}">Cancelar</a>
                <button class="button button-primary" type="submit"
                        th:text="${editing ? 'Salvar alterações' : 'Criar usuário'}">
                    Criar usuário
                </button>
            </div>
        </form>
    </article>
</section>
</html>
