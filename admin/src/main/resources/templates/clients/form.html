<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${editing ? 'Editar cliente' : 'Novo cliente'}, 'clients', ~{::section})}">
<section class="page-stack">
    <div class="page-heading compact-heading">
        <div>
            <a class="back-link" th:href="@{/clients}">← Voltar para clientes</a>
            <span class="eyebrow">Base do aplicativo</span>
            <h2 th:text="${editing ? 'Editar cliente' : 'Novo cliente'}">Novo cliente</h2>
            <p th:text="${editing ? 'Atualize o cadastro, os créditos e a verificação da conta.' : 'Adicione uma pessoa à base de clientes do Fitcha.'}">
                Adicione uma pessoa à base de clientes do Fitcha.
            </p>
        </div>
    </div>

    <article class="panel form-panel">
        <form class="entity-form"
              th:action="${editing} ? @{/clients/{id}(id=${client.id})} : @{/clients}"
              method="post">
            <div class="form-grid">
                <label class="field field-full">
                    <span>Nome completo</span>
                    <input type="text" name="name" th:value="${client.name}" placeholder="Nome do cliente" required>
                </label>

                <label class="field field-full">
                    <span>E-mail</span>
                    <input type="email" name="email" th:value="${client.email}" placeholder="cliente@email.com" required>
                </label>

                <label class="field">
                    <span>Créditos</span>
                    <input type="number" name="credits" min="0" step="1" th:value="${client.credits}" required>
                    <small>Saldo disponível para gerar treinos com IA.</small>
                </label>

                <label class="check-field check-field-card">
                    <input type="checkbox" name="verified" value="true" th:checked="${client.verified}">
                    <span>Conta verificada</span>
                    <small>Permite que o cliente entre no aplicativo.</small>
                </label>

                <label class="field field-full">
                    <span th:text="${editing ? 'Nova senha' : 'Senha inicial'}">Senha inicial</span>
                    <input
                        type="password"
                        name="password"
                        placeholder="Digite uma senha segura"
                        autocomplete="new-password"
                        th:required="${!editing}">
                    <small th:if="${editing}">Deixe em branco para manter a senha atual. Novas senhas usam BCrypt com 14 rounds.</small>
                </label>
            </div>

            <div class="form-actions">
                <a class="button button-ghost" th:href="@{/clients}">Cancelar</a>
                <button class="button button-primary" type="submit"
                        th:text="${editing ? 'Salvar alterações' : 'Criar cliente'}">
                    Criar cliente
                </button>
            </div>
        </form>
    </article>
</section>
</html>
