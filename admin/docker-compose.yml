name: fitcha-admin-local

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitcha
      POSTGRES_USER: fitcha_admin
      POSTGRES_PASSWORD: fitcha_admin_local
    ports:
      - "${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - fitcha_admin_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcha_admin -d fitcha"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - fitcha-admin-network

  migrate:
    image: migrate/migrate:v4.19.1
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend/pkg/db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://fitcha_admin:fitcha_admin_local@db:5432/fitcha?sslmode=disable"
      - "up"
    networks:
      - fitcha-admin-network

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_DB_URL: jdbc:postgresql://db:5432/fitcha
      ADMIN_DB_USER: fitcha_admin
      ADMIN_DB_PASSWORD: fitcha_admin_local
      SERVER_PORT: 8081
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${ADMIN_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - fitcha-admin-network

volumes:
  fitcha_admin_local_data:

networks:
  fitcha-admin-network:
