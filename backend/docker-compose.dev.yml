services:
  api:
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_ADDR: redis:6379
    ports:
      - "${PORT:-8080}"

  worker:
    env_file:
      - .env
    environment:
      REDIS_ADDR: redis:6379

  db:
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "${DB_PORT:-5432}"

  redis:
    ports:
      - "6379:6379"
