services:
  api:
    build:
      context: .
    container_name: fitcha_api
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    networks:
      - fitcha-network

networks:
  fitcha-network:
