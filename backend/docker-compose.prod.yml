x-backend: &backend
  image: fitcha-backend:local
  restart: unless-stopped
  env_file:
    - .env

services:
  api:
    <<: *backend
    build:
      context: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT:-8080}/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    command: ["./worker"]
