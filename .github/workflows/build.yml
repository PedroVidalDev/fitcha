name: Build APK & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

defaults:
  run:
    working-directory: ./frontend

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve app version
        id: app_version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $APP_VERSION"

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Download APK artifact
        run: |
          BUILD_URL=$(node -e "const fs=require('fs'); const raw=JSON.parse(fs.readFileSync('build.json','utf8')); const build=Array.isArray(raw)?raw[0]:raw; if(!build?.artifacts?.buildUrl){process.exit(1)}; process.stdout.write(build.artifacts.buildUrl)")
          echo "Downloading APK from: $BUILD_URL"
          curl -L -o app-release.apk "$BUILD_URL"

      - name: Generate version tag
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v${{ steps.app_version.outputs.version }}-$SHORT_SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Fitcha ${{ steps.app_version.outputs.version }}
          body: |
            Release automatica da versao `${{ steps.app_version.outputs.version }}` gerada a partir do commit `${{ github.sha }}`.

            Baixe o APK abaixo e instale no seu Android.

            Pode ser necessario habilitar "Instalar de fontes desconhecidas" nas configuracoes do celular.
          files: frontend/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release metadata to API
        env:
          APP_RELEASE_SYNC_URL: ${{ secrets.APP_RELEASE_SYNC_URL }}
          APP_UPDATE_TOKEN: ${{ secrets.APP_UPDATE_TOKEN }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/latest
        run: |
          if [ -z "$APP_RELEASE_SYNC_URL" ] || [ -z "$APP_UPDATE_TOKEN" ]; then
            echo "APP_RELEASE_SYNC_URL and APP_UPDATE_TOKEN were not configured."
            echo "The GitHub release was created, but the API release metadata was not synchronized."
            exit 0
          fi

          RELEASED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          PAYLOAD=$(printf '{"latestVersion":"%s","releaseTag":"%s","releaseUrl":"%s","releasedAt":"%s"}' "$APP_VERSION" "$RELEASE_TAG" "$RELEASE_URL" "$RELEASED_AT")

          curl --fail-with-body \
            -X PUT "$APP_RELEASE_SYNC_URL" \
            -H "Content-Type: application/json" \
            -H "X-App-Update-Token: $APP_UPDATE_TOKEN" \
            -d "$PAYLOAD"
